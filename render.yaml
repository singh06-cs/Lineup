# Render Blueprint: one click creates the database, the API and the React site.
# https://render.com/docs/blueprint-spec
# The .onrender.com names below assume these service names are free; if Render
# assigns different URLs, update ALLOWED_HOSTS / CORS / CSRF / VITE_API_URL to match.

databases:
  - name: lineup-db
    plan: free

services:
  - type: web
    name: lineup-api
    runtime: python
    plan: free
    rootDir: backend
    # Migrations run on every deploy so the schema always matches the code.
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput
    # gunicorn: a production WSGI server (runserver is single-threaded and dev-only).
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: lineup-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: lineup-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://lineup-web.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://lineup-api.onrender.com

  - type: web
    name: lineup-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # Single-page app: every URL serves index.html and React Router picks the page.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Baked into the JavaScript at build time (Vite replaces import.meta.env.VITE_*).
      - key: VITE_API_URL
        value: https://lineup-api.onrender.com
